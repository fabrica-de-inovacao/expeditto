[project]
name = "expeditto"
version = "0.3.0"
description = "Expeditto: seu segundo expediente, resolvido. Assistente de burocracia docente (RIT do SUAP IFMA), com CLI e servidor MCP."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["docente", "rit", "suap", "ifma", "mcp", "automacao"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
]
authors = [
    { name = "Vinicius Schneider", email = "contatovschneider@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.8.9",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "lxml>=6.1.3",
    "mcp[cli]>=2.2.0",
    "pikepdf>=10.16.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "textual>=8.2",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://expeditto.fabitz.com.br"

[project.scripts]
expeditto = "expeditto:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
