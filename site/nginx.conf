# Configuração personalizada do nginx para o Coolify (Build Pack "Static", Base Directory /site).
# O Coolify copia a pasta para uma imagem nginx e o Traefik dele cuida do domínio e do HTTPS.
# Cole este conteúdo em Configuration > General > Custom Nginx Configuration (ou envie pela API).
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript image/svg+xml;

    # Os scripts de instalação vão como texto (irm | iex e curl | sh), sem cache.
    location ~ \.(ps1|sh)$ {
        default_type text/plain;
        types { }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    # Arquivos de manutenção da pasta não são publicados.
    location ~ \.(py|conf|md)$ {
        return 404;
    }

    location ~ \.svg$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
